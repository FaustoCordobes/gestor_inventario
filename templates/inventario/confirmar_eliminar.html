{% extends "base.html" %}

{% block titulo %}Eliminar producto · Gestor de Inventario{% endblock %}

{% block contenido %}
<h1 class="titulo-pagina">Eliminar producto</h1>

<div class="tarjeta tarjeta-form">
    <p>¿Seguro que querés eliminar <strong>{{ producto.nombre }}</strong> (código {{ producto.codigo }})?</p>
    <p class="texto-suave">Esta acción no se puede deshacer.</p>

    <form method="post" class="botones-form">
        <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
        <a class="boton boton-claro" href="{{ url_for('inventario.lista') }}">Cancelar</a>
    </form>
</div>
{% endblock %}
