{% extends "base.html" %}

{% block title %}Crear cuenta · Gestor de Inventario{% endblock %}

{% block content %}
<div class="card card-access">
    <span class="brand-icon brand-icon-large">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>
    </span>
    <h1>Crear cuenta</h1>
    <p class="text-muted">Completá tus datos para empezar a usar el sistema.</p>

    <form method="post" class="form">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <label for="confirmation">Repetir contraseña</label>
        <input type="password" id="confirmation" name="confirmation" minlength="6" required>

        <button type="submit" class="button button-wide">Crear cuenta</button>
    </form>

    <p class="text-muted access-footer">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a></p>
</div>
{% endblock %}
