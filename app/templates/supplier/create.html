{% extends "base.html" %}

{% block title %}{{ 'Editar proveedor' if supplier else 'Nuevo proveedor' }} · Gestor de Inventario{% endblock %}

{% block content %}
<h1 class="page-title">{{ 'Editar proveedor' if supplier else 'Nuevo proveedor' }}</h1>

<div class="card card-form">
    <form method="post" class="form form-no-margin" novalidate>
        <div class="row-double">
            <div>
                <label for="supplier_type">Tipo de proveedor *</label>
                <select id="supplier_type" name="supplier_type" required data-autofocus>
                    <option value="" disabled {{ 'selected' if not data.supplier_type }}>Elegí un tipo</option>
                    {% for t in supplier_types %}
                    <option value="{{ t }}" {{ 'selected' if data.supplier_type == t }}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="is_active">Activo</label>
                <input type="checkbox" id="is_active" name="is_active" {{ 'checked' if data.is_active }}>
            </div>
        </div>

        <div class="row-double">
            <div>
                <label for="name">Nombre *</label>
                <input type="text" id="name" name="name" maxlength="100" value="{{ data.name }}" placeholder="Ej: Sportline Distribution" required>
            </div>
            <div>
                <label for="contact_name">Persona de contacto</label>
                <input type="text" id="contact_name" name="contact_name" maxlength="100" value="{{ data.contact_name }}" placeholder="Ej: Juan Pérez">
            </div>
        </div>

        <div class="row-double">
            <div>
                <label for="phone">Teléfono</label>
                <input type="text" id="phone" name="phone" maxlength="30" value="{{ data.phone }}" placeholder="Ej: +54 11 4555-1001">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="120" value="{{ data.email }}" placeholder="Ej: ventas@proveedor.com">
            </div>
        </div>

        <label for="address">Dirección</label>
        <input type="text" id="address" name="address" maxlength="150" value="{{ data.address }}" placeholder="Ej: Av. Corrientes 1200, Buenos Aires">

        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="3" placeholder="Ej: Ropa deportiva para running">{{ data.description }}</textarea>

        <p class="text-muted form-note">Los campos con * son obligatorios.</p>

        <div class="form-buttons">
            <button type="submit" class="button">{{ 'Guardar cambios' if supplier else 'Crear proveedor' }}</button>
            <a class="button button-light" href="{{ url_for('supplier.detail', supplier_id=supplier.id) if supplier else url_for('supplier.index') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
