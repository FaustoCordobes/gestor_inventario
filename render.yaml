databases:
  - name: gestor-db
    databaseName: gestor_inventario
    user: gestor
    plan: free

services:
  - type: web
    name: gestor-inventario
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /auth/login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: gestor-inventario-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mcp_inventario
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-db
          property: connectionString
